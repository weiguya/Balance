<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5">
<title>ยอดเงิน</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#181818;--muted:#8a8a85;--line:#e7e7e2;--green:#318b59;--red:#d34b45;--dark:#191919}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Arial,sans-serif}.app{max-width:760px;margin:auto;padding:30px 18px 105px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.title{font-size:30px;font-weight:750;letter-spacing:-.7px}.sub{font-size:13px;color:var(--muted);margin-top:5px}.add,.fab{border:0;background:var(--dark);color:#fff;cursor:pointer;box-shadow:0 7px 22px #0002}.add{width:46px;height:46px;border-radius:14px;font-size:28px}.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;font-size:30px;z-index:4}
.filterbar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.filter{border:1px solid var(--line);background:#fff;color:#666;border-radius:10px;padding:9px 13px;white-space:nowrap;font-size:14px}.filter.active{background:#191919;color:#fff;border-color:#191919}
.calendar-wrap{margin-bottom:13px}.month-button{width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 15px;cursor:pointer;text-align:left}.month-main{font-size:16px;font-weight:650}.month-small{font-size:12px;color:var(--muted);margin-top:2px}.chev{font-size:18px;color:#777;transition:.2s}.calendar-wrap.open .chev{transform:rotate(180deg)}.calendar{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:7px;padding:15px;box-shadow:0 10px 30px #0000000d}.calendar-wrap.open .calendar{display:block}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cal-nav{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fafaf8;cursor:pointer}.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cal-month{border:1px solid var(--line);background:#fafaf8;border-radius:10px;padding:11px 4px;cursor:pointer}.cal-month.current{background:#f0f0ed;border-color:#222;font-weight:700}
.summary{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px 18px;margin-bottom:14px;box-shadow:0 3px 14px #00000008}.summary-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.summary-label{font-size:12px;color:var(--muted)}.current{font-size:26px;font-weight:750;margin-top:3px}.net{text-align:right;font-size:19px;font-weight:700}.net small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:2px}.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:#888}.summary-line{height:1px;background:var(--line);margin:14px 0 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:15px;color:#333;margin-top:3px}
.list{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.list-head,.row{display:grid;grid-template-columns:1fr 1fr 82px;gap:8px}.list-head{padding:12px 16px;background:#fafaf8;color:#999;font-size:11px;border-bottom:1px solid var(--line)}.row{position:relative;align-items:center;min-height:65px;padding:12px 16px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.date{font-size:14px;color:#777}.balance{font-size:18px;font-weight:650}.change{text-align:right;font-size:16px;font-weight:650;white-space:nowrap}.delete{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#fff;color:#aaa;cursor:pointer}.row:hover .delete{display:block}.empty{text-align:center;color:var(--muted);padding:52px 20px;font-size:14px}
.sheet-back{display:none;position:fixed;inset:0;background:#0005;z-index:10;align-items:flex-end}.sheet-back.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:23px 23px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px #0002}.grab{width:38px;height:4px;background:#d5d5d1;border-radius:5px;margin:0 auto 18px}.sheet-title{font-size:20px;font-weight:700;margin-bottom:15px}.date-row{display:flex;align-items:center;justify-content:space-between;background:#f7f7f5;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:10px}.date-row label{font-size:12px;color:var(--muted)}.date-row button{border:0;background:transparent;font-weight:650;cursor:pointer}.amount{width:100%;border:0;border-bottom:1px solid #d8d8d3;padding:8px 2px 12px;background:transparent;font-size:30px;font-weight:700;outline:0}.amount::placeholder{color:#c5c5c0}.help{font-size:12px;color:var(--muted);margin-top:8px}.sheet-actions{display:flex;gap:9px;margin-top:18px}.sheet-actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:650}.cancel{background:#eee}.save{background:#191919;color:#fff}
@media(max-width:480px){.list-head,.row{grid-template-columns:1fr 1fr 72px}.balance{font-size:17px}.change{font-size:15px}}
</style></head>
<body><div class="app">
<div class="top"><div><div class="title">ยอดเงิน</div><div class="sub">บันทึกเมื่อมีการนับจริง ไม่จำเป็นต้องบันทึกทุกวัน</div></div><button class="add" id="topAdd">+</button></div>
<div class="filterbar"><button class="filter" data-filter="all">ทั้งหมด</button><button class="filter active" data-filter="month">เดือนนี้</button></div>
<div class="calendar-wrap" id="calendarWrap"><button class="month-button" id="monthButton"><div><div class="month-main" id="monthTitle"></div><div class="month-small" id="monthSmall">แตะเพื่อเลือกเดือน</div></div><div class="chev">⌄</div></button><div class="calendar"><div class="cal-head"><button class="cal-nav" id="prevYear">‹</button><strong id="yearTitle"></strong><button class="cal-nav" id="nextYear">›</button></div><div class="cal-grid" id="calGrid"></div></div></div>
<section class="summary"><div class="summary-top"><div><div class="summary-label">ยอดคงเหลือปัจจุบัน</div><div class="current" id="currentBalance">—</div></div><div class="net zero" id="netChange"><small>เปลี่ยนแปลงสุทธิ</small>—</div></div><div class="summary-line"></div><div class="stats"><div class="stat">ยอดตั้งต้น<b id="startBalance">—</b></div><div class="stat">รวมเงินเข้า<b class="pos" id="plusTotal">+0</b></div><div class="stat">รวมเงินออก<b class="neg" id="minusTotal">-0</b></div></div></section>
<section class="list"><div class="list-head"><div>วันที่</div><div>ยอดคงเหลือ</div><div style="text-align:right">เปลี่ยนแปลง</div></div><div id="list"></div></section></div>
<button class="fab" id="fab">+</button>
<div class="sheet-back" id="sheetBack"><div class="sheet"><div class="grab"></div><div class="sheet-title">บันทึกยอดเงิน</div><div class="date-row"><label>วันที่</label><button id="dateButton"></button></div><input class="amount" id="amount" type="number" inputmode="decimal" placeholder="0" autocomplete="off"><div class="help">ใส่ยอดคงเหลือที่นับจริง ระบบจะคำนวณ + / − จากครั้งก่อนให้อัตโนมัติ</div><div class="sheet-actions"><button class="cancel" id="cancel">ยกเลิก</button><button class="save" id="save">บันทึก</button></div></div></div>
<script>
const KEY='balance-log-v2';let records=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('balance-log-v1')||'[]'),filter='month',selectedMonth=new Date().getMonth(),selectedYear=new Date().getFullYear(),calendarYear=selectedYear;
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:2}).format(n),pad=n=>String(n).padStart(2,'0'),iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`,thaiDate=s=>{let[y,m,d]=s.split('-').map(Number);return `${d}.${m}.${String(y+543).slice(-2)}`},thaiMonth=(m,y)=>new Intl.DateTimeFormat('th-TH',{month:'long',year:'numeric'}).format(new Date(y,m,1));
function sorted(){return [...records].sort((a,b)=>a.date.localeCompare(b.date))}function visible(){let a=sorted();return filter==='all'?a:a.filter(r=>r.date.startsWith(`${selectedYear}-${pad(selectedMonth+1)}`))}
function renderCalendar(){ $('yearTitle').textContent=calendarYear+543;$('calGrid').innerHTML=Array.from({length:12},(_,m)=>`<button class="cal-month ${m===selectedMonth&&calendarYear===selectedYear?'current':''}" data-m="${m}">${new Intl.DateTimeFormat('th-TH',{month:'short'}).format(new Date(calendarYear,m,1))}</button>`).join('');document.querySelectorAll('.cal-month').forEach(b=>b.onclick=()=>{selectedMonth=+b.dataset.m;selectedYear=calendarYear;filter='month';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='month'));$('calendarWrap').classList.remove('open');render()})}
function render(){let rows=visible();$('monthTitle').textContent=filter==='all'?'ทั้งหมด':thaiMonth(selectedMonth,selectedYear);$('monthSmall').textContent=filter==='all'?'แสดงทุกเดือน':'แตะเพื่อเลือกเดือน';if(!rows.length){$('currentBalance').textContent='—';$('startBalance').textContent='—';$('plusTotal').textContent='+0';$('minusTotal').textContent='-0';$('netChange').className='net zero';$('netChange').innerHTML='<small>เปลี่ยนแปลงสุทธิ</small>—';$('list').innerHTML='<div class="empty">ยังไม่มีรายการในช่วงนี้</div>';return}let first=rows[0],last=rows[rows.length-1],plus=0,minus=0;for(let i=1;i<rows.length;i++){let d=rows[i].balance-rows[i-1].balance;if(d>0)plus+=d;if(d<0)minus+=Math.abs(d)}let net=last.balance-first.balance;$('currentBalance').textContent=money(last.balance)+' บาท';$('startBalance').textContent=money(first.balance)+' บาท';$('plusTotal').textContent='+'+money(plus);$('minusTotal').textContent='-'+money(minus);let c=net>0?'pos':net<0?'neg':'zero';$('netChange').className='net '+c;$('netChange').innerHTML=`<small>เปลี่ยนแปลงสุทธิ</small>${net>0?'+':''}${money(net)} บาท`;$('list').innerHTML=rows.map((r,i)=>{let d=i? r.balance-rows[i-1].balance:null,change='<span class="zero">—</span>';if(d!==null){let c=d>0?'pos':d<0?'neg':'zero';change=`<span class="${c}">${d>0?'+':''}${money(d)}</span>`}return `<div class="row"><div class="date">${thaiDate(r.date)}</div><div class="balance">${money(r.balance)} บาท</div><div class="change">${change}</div><button class="delete" onclick="removeRecord('${r.id}')">×</button></div>`}).join('')}
function today(){return new Date().toISOString().slice(0,10)}function openSheet(){$('sheetBack').classList.add('open');let d=today();$('dateButton').dataset.date=d;$('dateButton').textContent=thaiDate(d);$('amount').value='';setTimeout(()=>$('amount').focus(),120)}function closeSheet(){$('sheetBack').classList.remove('open')}
$('topAdd').onclick=openSheet;$('fab').onclick=openSheet;$('cancel').onclick=closeSheet;$('sheetBack').onclick=e=>{if(e.target===$('sheetBack'))closeSheet()};
$('save').onclick=()=>{let date=$('dateButton').dataset.date,v=$('amount').value.trim(),balance=Number(v);if(!v||!Number.isFinite(balance)||balance<0){$('amount').focus();return}let old=records.find(r=>r.date===date);if(old)old.balance=balance;else records.push({id:Date.now().toString(36),date,balance});localStorage.setItem(KEY,JSON.stringify(records));closeSheet();render()};
$('dateButton').onclick=()=>{let old=document.getElementById('datePickerInline');if(old){old.remove();return}let d=new Date($('dateButton').dataset.date+'T12:00:00'),y=d.getFullYear(),m=d.getMonth(),wrap=document.createElement('div');wrap.id='datePickerInline';wrap.style.cssText='margin-top:8px;background:#fafaf8;border:1px solid #e5e5e0;border-radius:14px;padding:12px';wrap.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button id="dpPrev" style="border:0;background:#eee;border-radius:8px;width:34px;height:34px">‹</button><b id="dpTitle"></b><button id="dpNext" style="border:0;background:#eee;border-radius:8px;width:34px;height:34px">›</button></div><div id="dpGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px"></div>`;$('dateButton').parentElement.after(wrap);function draw(){$('dpTitle').textContent=thaiMonth(m,y);let g=$('dpGrid');g.innerHTML='';let start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<start;i++)g.appendChild(document.createElement('span'));for(let day=1;day<=days;day++){let b=document.createElement('button');b.textContent=day;b.style.cssText='border:0;background:#fff;border-radius:8px;padding:9px 2px;cursor:pointer';b.onclick=()=>{let val=iso(y,m,day);$('dateButton').dataset.date=val;$('dateButton').textContent=thaiDate(val);wrap.remove()};g.appendChild(b)}}$('dpPrev').onclick=()=>{m--;if(m<0){m=11;y--}draw()};$('dpNext').onclick=()=>{m++;if(m>11){m=0;y++}draw()};draw()};

document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));if(filter==='month'){selectedMonth=new Date().getMonth();selectedYear=new Date().getFullYear()}render()});$('monthButton').onclick=()=>{$('calendarWrap').classList.toggle('open');calendarYear=selectedYear;renderCalendar()};$('prevYear').onclick=e=>{e.stopPropagation();calendarYear--;renderCalendar()};$('nextYear').onclick=e=>{e.stopPropagation();calendarYear++;renderCalendar()};
function removeRecord(id){let r=records.find(x=>x.id===id);if(r&&confirm('ลบรายการวันที่ '+thaiDate(r.date)+' ?')){records=records.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(records));render()}}
renderCalendar();render();
</script></body></html>
